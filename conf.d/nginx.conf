server {
    listen 11200 ssl;
    server_name localhost;
    
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Namen zur Laufzeit ueber den Docker-DNS aufloesen. Mit festem Namen in
    # proxy_pass loest nginx nur einmal beim Start auf; nach einem
    # "docker compose up --build" haben ui und server neue IPs, nginx schickte
    # weiter an die alten und lieferte 502 - die App meldete dann alle ab.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $ui_upstream http://ui:80;
        proxy_pass $ui_upstream;
    }

    location /server/ {
        set $server_upstream http://server:8080;
        # Mit Variable schneidet proxy_pass das Praefix nicht mehr selbst ab.
        rewrite ^/server/(.*)$ /$1 break;
        proxy_pass $server_upstream;
    }
}
