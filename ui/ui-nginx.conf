server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression. Das JS-Bundle geht dadurch von rund 1,3 MB auf etwa 420 kB
    # ueber die Leitung - der groesste Einzelgewinn beim Laden am Handy.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Inhaltsgehashte Dateinamen aendern sich bei jeder Aenderung, deshalb
    # duerfen sie beliebig lange im Cache bleiben.
    location /assets/ {
        # Nur add_header, nicht zusaetzlich expires - sonst gehen zwei
        # Cache-Control-Header raus.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Diese drei entscheiden, ob ein Update ueberhaupt ankommt. Werden sie
    # gecacht, bleibt der Nutzer auf einer alten Version haengen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Die alte Version verwies auf /manifest.json. Installationen von damals
    # fragen weiter diesen Pfad ab; ohne diese Regel bekaemen sie eine
    # HTML-Seite als Manifest. So uebernehmen sie beim naechsten Abruf Name,
    # Symbole und Farben der neuen Version.
    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.webmanifest;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Selbstheilung fuer Installationen der alten Version.
    #
    # Die alte Anwendung (Create React App) lud ihre Dateien aus /static/. Diese
    # Pfade gibt es nicht mehr. Haengt bei jemandem noch die alte index.html im
    # Browser-Cache, wuerde sie ins Leere laden und einen weissen Bildschirm
    # zeigen. Statt dessen kommt hier ein kurzes Skript zurueck, das die Caches
    # leert und die Seite unter einer neuen Adresse frisch laedt - damit landet
    # der Nutzer automatisch auf der aktuellen Version.
    #
    # Es kann sich nicht aufschaukeln: die neue Version laedt nie aus /static/.
    location /static/ {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "(function(){function go(){location.replace('/?v='+Date.now())}try{if(window.caches&&caches.keys){caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}).then(go,go);return}}catch(e){}go()})();";
    }

    location / {
        # Bewusst 404 statt index.html: die Anwendung nutzt HashRouter, alle
        # Routen stehen hinter '#'. Ein Fallback auf index.html wuerde nur
        # fehlende Dateien als HTML ausliefern - ein Skript, das HTML
        # zurueckbekommt, bricht mit einem Syntaxfehler ab.
        try_files $uri $uri/ =404;
    }
}
