server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression. Das JS-Bundle geht dadurch von rund 1,3 MB auf etwa 420 kB
    # ueber die Leitung - der groesste Einzelgewinn beim Laden am Handy.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Inhaltsgehashte Dateinamen aendern sich bei jeder Aenderung, deshalb
    # duerfen sie beliebig lange im Cache bleiben.
    location /assets/ {
        # Nur add_header, nicht zusaetzlich expires - sonst gehen zwei
        # Cache-Control-Header raus.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Diese drei entscheiden, ob ein Update ueberhaupt ankommt. Werden sie
    # gecacht, bleibt der Nutzer auf einer alten Version haengen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
