<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover ist die Voraussetzung dafuer, dass
         env(safe-area-inset-*) im Standalone-Modus ueberhaupt Werte liefert. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#c8102e"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141414"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="description" content="FFW Wemding Atemschutzpflegestelle" />

    <!-- Vom Startbildschirm gestartet ohne Browserleiste. Neuere iOS-Versionen
         lesen das aus dem Manifest, aeltere brauchen diese Tags. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Kurz halten: iOS schneidet den Namen unter dem Icon ab. -->
    <meta name="apple-mobile-web-app-title" content="Atemschutz" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Atemschutzpflegestelle</title>
  </head>
  <body>
    <noscript>Diese Anwendung benötigt JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
