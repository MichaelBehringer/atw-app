name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        # Nur die geaenderten Dateien waeren schoener - so faellt aber jede
        # unformatierte Datei auf.
        run: |
          unformatiert=$(gofmt -l .)
          if [ -n "$unformatiert" ]; then
            echo "Nicht mit gofmt formatiert:"
            echo "$unformatiert"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  ui:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker-Images bauen
    runs-on: ubuntu-latest
    needs: [server, ui]
    steps:
      - uses: actions/checkout@v5
      # Nur bauen, nicht pushen: prueft, dass die Images auf der VM genauso
      # entstehen wie hier.
      - run: docker build -t atw-app-server:ci server
      - run: docker build -t atw-app-ui:ci ui
