services:
  server:
    build: server
    deploy:
      mode: replicated
      replicas: 1
    restart: always
    extra_hosts:
    - "host.docker.internal:host-gateway"
    environment:
      # Siehe server/.env.example. Ohne diese Werte greifen die Defaults aus
      # dem Quellcode, die identisch mit dem bisherigen Verhalten sind.
      ATW_DB_DSN: "ffwadmin:gnidmewff@tcp(host.docker.internal:3306)/ffw"
      ATW_LISTEN_ADDR: ":8080"
      ATW_JWT_SECRET: "my_secret_key"
      GIN_MODE: "release"
  ui:
    build: ui
    deploy:
      mode: replicated
      replicas: 1
    restart: always
  nginx:
    image: nginx:1.30-alpine
    volumes:
     - ./conf.d:/etc/nginx/conf.d
     - ./certs:/etc/nginx/certs
    ports:
    - "11200:11200"
    depends_on:
      - ui
      - server
    restart: always
