services:
  server:
    build: server
    deploy:
      mode: replicated
      replicas: 1
    restart: always
    extra_hosts:
    - "host.docker.internal:host-gateway"
    environment:
      # Die Werte kommen aus der Datei .env neben dieser docker-compose.yml.
      # Sie ist gitignored - Zugangsdaten gehoeren nicht ins Repository.
      # Vorlage: .env.example. Fehlt ein Wert, bricht "docker compose up" mit
      # einer Meldung ab, statt stillschweigend einen Standard zu nehmen.
      ATW_DB_DSN: ${ATW_DB_DSN:?ATW_DB_DSN fehlt - siehe .env.example}
      ATW_JWT_SECRET: ${ATW_JWT_SECRET:?ATW_JWT_SECRET fehlt - siehe .env.example}
      ATW_LISTEN_ADDR: ":8080"
      GIN_MODE: "release"
      # Benachrichtigungen sind hier bewusst ausdruecklich an.
      ATW_NTFY_ENABLED: "true"
      # Ein Tipp auf die Benachrichtigung oeffnet die App.
      ATW_APP_URL: "https://ffw.behringer.dev/"
  ui:
    build: ui
    deploy:
      mode: replicated
      replicas: 1
    restart: always
  nginx:
    image: nginx:1.30-alpine
    volumes:
     - ./conf.d:/etc/nginx/conf.d
     - ./certs:/etc/nginx/certs
    ports:
    - "11200:11200"
    depends_on:
      - ui
      - server
    restart: always
    networks:
      # default: erreicht ui und server. edge: darueber reicht der Edge-Proxy
      # (/root/edge, conf.d/30-ffw.conf) https://ffw.behringer.dev hierher
      # weiter. Port 11200 bleibt daneben fuer die alte Adresse offen. Der
      # Alias ist noetig, weil "nginx" im gemeinsamen Netz schon der
      # Edge-Proxy selbst ist.
      default: {}
      edge:
        aliases:
          - atw-app

networks:
  # Angelegt mit "docker network create edge", vorausgesetzt von /root/edge.
  # external: true heisst, dass dieser Stack es nicht anlegt und beim
  # "docker compose down" auch nicht entfernt.
  edge:
    external: true
